name: Deploy dist to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /public/dashboard
          remote_host: ${{ secrets.IONOS_HOST }}
          remote_port: ${{ secrets.IONOS_PORT }}
          remote_user: ${{ secrets.IONOS_USER }}
          remote_key: ${{ secrets.IONOS_SSH_KEY }}