name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to IONOS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: access-5019953950.webspace-host.com
          username: su1182555
          key: ${{ secrets.IONOS_SSH_KEY }}
          source: "dist/*"
          target: "~/public/dashboard-beta"
          strip_components: 1
          rm: true

      - name: Notify Discord via API
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMITS=$(git log --pretty=format:"%s" -5)
          COMMITS_ESCAPED=$(echo "$COMMITS" | tr '\n' '|' | sed 's/"/\\"/g')
          curl -X POST https://beta-api.nouvaire.io/api/deploy-notification \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\",\"commits\":\"$COMMITS_ESCAPED\",\"deployed_at\":\"$(date '+%Y-%m-%d %H:%M:%S')\"}"