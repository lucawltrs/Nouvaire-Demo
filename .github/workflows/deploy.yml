name: Deploy dist to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      
      - name: Test password login
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -e ssh \
            -p ${{ secrets.IONOS_PORT }} \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -v \
            ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "echo success" 2>&1

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -e rsync -avzr --delete \
            -e "ssh -p ${{ secrets.IONOS_PORT }} -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password" \
            dist/ \
            ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/public/dashboard
