name: Deploy dist to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Debug SSH Key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.IONOS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.IONOS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.IONOS_PORT }} ${{ secrets.IONOS_HOST }} >> ~/.ssh/known_hosts
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.IONOS_PORT }} -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/public/dashboard
