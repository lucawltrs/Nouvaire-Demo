name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to IONOS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: access-5019953950.webspace-host.com
          username: su1182555
          key: ${{ secrets.IONOS_SSH_KEY }}
          source: "dist/*"
          target: "~/public/dashboard-beta"
          strip_components: 1
          rm: true